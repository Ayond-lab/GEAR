apiVersion: gear.eu/v1
kind: Mandate
metadata:
  name: mnd-2026-021
  namespace: gear-lab
spec:
  mandateId: MND-2026-021
  version: 2
  abilityRef: cv-screen
  abilityVersion: 0.3.0
  purposeStatement: Identify candidates who will require work authorisation, for planning.
  legalBasis: Right-to-work verification
  sources:
    - type: folder
      id: applications-inbox
  connectorGrants:
    - connector: applications-store
      scope: read
    - connector: candidate-record
      scope: write
  actionGrants:
    - class: RECORD_ANNOTATE
      disposition: permit
    - class: RECORD_MODIFY
      disposition: escalate
    - class: CANDIDATE_RANK
      disposition: forbid
    - class: OUTBOUND_COMMS
      disposition: forbid
  caps:
    dailyActions: 50
  thresholds:
    extractionConfidence: "0.70"
  approvers:
    - id: hiring-manager-1
      name: Hiring Manager
  egress: []
  expiresAt: "2027-02-01T00:00:00Z"
  credentialRef:
    name: mnd-2026-021-credential
    namespace: gear-lab
