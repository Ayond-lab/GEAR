apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gear-ability-egress-baseline
  namespace: gear-lab
spec:
  podSelector:
    matchExpressions:
      - key: gear.eu/ability
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gear-system
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - gear-policy
                  - gear-inference
                  - gear-fixture-store
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 443
