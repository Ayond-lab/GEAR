apiVersion: v1
kind: ServiceAccount
metadata:
  name: gear-webhooks
  namespace: gear-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gear-webhooks
rules:
  - apiGroups: ["gear.eu"]
    resources: ["abilities"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gear-webhooks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gear-webhooks
subjects:
  - kind: ServiceAccount
    name: gear-webhooks
    namespace: gear-system

