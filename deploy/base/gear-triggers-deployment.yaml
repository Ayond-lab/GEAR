apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear-triggers
  namespace: gear-system
  labels:
    app.kubernetes.io/name: gear-triggers
    app.kubernetes.io/part-of: gear
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gear-triggers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gear-triggers
        app.kubernetes.io/part-of: gear
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gear-triggers
          image: ghcr.io/ayond-lab/gear-triggers:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GEAR_AUDIT_URL
              value: http://gear-audit.gear-system.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
