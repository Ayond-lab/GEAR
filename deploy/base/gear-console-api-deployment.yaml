apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear-console-api
  namespace: gear-system
  labels:
    app.kubernetes.io/name: gear-console-api
    app.kubernetes.io/part-of: gear
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gear-console-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gear-console-api
        app.kubernetes.io/part-of: gear
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gear-console-api
          image: ghcr.io/ayond-lab/gear-console-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GEAR_CONSOLE_DIR
              value: /console
            - name: GEAR_EVIDENCE_ROOT
              value: /evidence
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
