apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear-fixture-store
  namespace: gear-system
  labels:
    app.kubernetes.io/name: gear-fixture-store
    app.kubernetes.io/part-of: gear
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gear-fixture-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gear-fixture-store
        app.kubernetes.io/part-of: gear
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gear-fixture-store
          image: ghcr.io/ayond-lab/gear-fixture-store:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GEAR_FIXTURE_NAMESPACE
              value: synthetic-cv-lab
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: fixture-data
              mountPath: /var/lib/gear-fixtures
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: fixture-data
          persistentVolumeClaim:
            claimName: gear-fixture-store-data
