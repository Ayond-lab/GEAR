apiVersion: apps/v1
kind: Deployment
metadata:
  name: gear-policy
  namespace: gear-system
  labels:
    app.kubernetes.io/name: gear-policy
    app.kubernetes.io/part-of: gear
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gear-policy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gear-policy
        app.kubernetes.io/part-of: gear
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gear-policy
          image: ghcr.io/ayond-lab/gear-policy:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GEAR_ADDR
              value: ":8443"
            - name: GEAR_HEALTH_ADDR
              value: ":8080"
            - name: GEAR_AUDIT_URL
              value: http://gear-audit.gear-system.svc.cluster.local:8080
            - name: GEAR_TLS_CERT
              value: /var/run/gear/policy-mtls/tls.crt
            - name: GEAR_TLS_KEY
              value: /var/run/gear/policy-mtls/tls.key
            - name: GEAR_CLIENT_CA
              value: /var/run/gear/policy-mtls/ca.crt
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: gear-policy-mtls
              mountPath: /var/run/gear/policy-mtls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: gear-policy-mtls
          secret:
            secretName: gear-policy-mtls
